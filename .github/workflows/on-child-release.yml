name: Mirror Release

on:
  repository_dispatch:
    types: [child-release-created]

permissions:
  contents: write

jobs:
  mirror-release:
    name: Mirror Desktop Release Assets
    runs-on: ubuntu-latest
    concurrency:
      group: desktop-mirror-${{ github.event.client_payload.tag }}
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.info.outputs.tag }}
      version: ${{ steps.info.outputs.version }}
    steps:
      - name: Extract release info
        id: info
        env:
          TAG: ${{ github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            echo "::error::Missing client_payload.tag"
            exit 1
          fi
          if [[ ! "$TAG" =~ ^(gitkb-desktop-)?v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Invalid tag format: $TAG (expected v<semver> or gitkb-desktop-v<semver>)"
            exit 1
          fi
          VERSION="${TAG#gitkb-desktop-}"
          VERSION="${VERSION#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # gitkb/harmony-desktop is private: the dependency-updates App's token, contents read on it alone.
      - name: Token to read gitkb/harmony-desktop
        id: desktop-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DEPENDENCY_UPDATES_APP_ID }}
          private-key: ${{ secrets.DEPENDENCY_UPDATES_APP_KEY }}
          owner: gitkb
          repositories: harmony-desktop
          permission-contents: read

      - name: Download assets from private release
        env:
          GH_TOKEN: ${{ steps.desktop-token.outputs.token }}
          TAG: ${{ steps.info.outputs.tag }}
        run: |
          set -euo pipefail
          gh api "repos/gitkb/harmony-desktop/releases/tags/$TAG" >"$RUNNER_TEMP/desktop-source.json"
          jq -e --arg tag "$TAG" '.tag_name == $tag and .draft == false and .published_at != null' \
            "$RUNNER_TEMP/desktop-source.json" >/dev/null
          mkdir -p release
          gh release download "$TAG" \
            --repo gitkb/harmony-desktop \
            --pattern "GitKB_universal.dmg" \
            --pattern "GitKB_universal.dmg.sha256" \
            --pattern "checksums.txt" \
            --dir release

      - name: Verify expected public assets
        run: |
          set -euo pipefail
          cd release
          for file in GitKB_universal.dmg GitKB_universal.dmg.sha256 checksums.txt; do
            test -s "$file"
            digest=$(sha256sum "$file" | cut -d' ' -f1)
            jq -e --arg name "$file" --arg digest "sha256:$digest" \
              'any(.assets[]; .name == $name and .digest == $digest)' "$RUNNER_TEMP/desktop-source.json" >/dev/null
          done
          shasum -a 256 -c GitKB_universal.dmg.sha256

      - name: Publish verified public release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.info.outputs.tag }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          if gh release view "$TAG" --repo "$repo" --json apiUrl >"$RUNNER_TEMP/view.json" 2>"$RUNNER_TEMP/view.err"; then
            api_url=$(jq -er .apiUrl "$RUNNER_TEMP/view.json")
            gh api "$api_url" >"$RUNNER_TEMP/public.json"
          elif grep -qi 'release not found' "$RUNNER_TEMP/view.err"; then
            cat >"$RUNNER_TEMP/notes.md" <<EOF
          GitKB Desktop $TAG public beta.

          Download \`GitKB_universal.dmg\` for macOS. The app is free to download and use locally.

          Requirements:
          - macOS 10.15 or newer
          - external \`git-kb\` CLI installed from Homebrew or the install script

          Install the CLI with \`brew install gitkb/tap/gitkb\` or \`curl -fsSL https://get.gitkb.com/install.sh | bash\`.

          If this beta is unsigned, macOS may require opening it from Finder with Control-click > Open.
          EOF
            gh release create "$TAG" --repo "$repo" --title "$TAG" --draft --notes-file "$RUNNER_TEMP/notes.md"
          else
            cat "$RUNNER_TEMP/view.err" >&2
            exit 1
          fi

          api_url=$(gh release view "$TAG" --repo "$repo" --json apiUrl --jq .apiUrl)
          gh api "$api_url" >"$RUNNER_TEMP/public.json"
          if [[ $(jq -r .draft "$RUNNER_TEMP/public.json") == true ]]; then
            gh release upload "$TAG" --repo "$repo" --clobber release/*
            gh api "$api_url" >"$RUNNER_TEMP/public.json"
          fi
          for path in release/*; do
            digest=$(sha256sum "$path" | cut -d' ' -f1)
            jq -e --arg name "${path##*/}" --arg digest "sha256:$digest" \
              'any(.assets[]; .name == $name and .digest == $digest)' "$RUNNER_TEMP/public.json" >/dev/null
          done
          if [[ $(jq -r .draft "$RUNNER_TEMP/public.json") == true ]]; then
            gh release edit "$TAG" --repo "$repo" --draft=false
          fi
