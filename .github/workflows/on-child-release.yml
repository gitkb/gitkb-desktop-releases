name: Mirror Release

on:
  repository_dispatch:
    types: [child-release-created]

permissions:
  contents: write

jobs:
  mirror-release:
    name: Mirror Desktop Release Assets
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.info.outputs.tag }}
      version: ${{ steps.info.outputs.version }}
    steps:
      - name: Extract release info
        id: info
        run: |
          TAG="${{ github.event.client_payload.tag }}"
          if [ -z "$TAG" ]; then
            echo "::error::Missing client_payload.tag"
            exit 1
          fi
          if [[ ! "$TAG" =~ ^(gitkb-desktop-)?v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Invalid tag format: $TAG (expected v<semver> or gitkb-desktop-v<semver>)"
            exit 1
          fi
          VERSION="${TAG#gitkb-desktop-}"
          VERSION="${VERSION#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download assets from private release
        env:
          GH_TOKEN: ${{ secrets.DESKTOP_SOURCE_REPO_PAT }}
        run: |
          mkdir -p release
          gh release download "${{ steps.info.outputs.tag }}" \
            --repo gitkb/harmony-desktop \
            --pattern "GitKB_universal.dmg" \
            --pattern "GitKB_universal.dmg.sha256" \
            --pattern "GitKB_linux_*" \
            --pattern "checksums.txt" \
            --dir release

      - name: Verify expected assets
        run: |
          set -euo pipefail
          test -f release/checksums.txt
          cd release
          for asset in GitKB_universal.dmg \
            GitKB_linux_x86_64.deb GitKB_linux_x86_64.rpm GitKB_linux_x86_64.AppImage \
            GitKB_linux_aarch64.deb GitKB_linux_aarch64.rpm GitKB_linux_aarch64.AppImage
          do
            test -f "$asset"
            test -f "$asset.sha256"
            shasum -a 256 -c "$asset.sha256"
          done

      - name: Create public release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.info.outputs.tag }}
          name: ${{ steps.info.outputs.tag }}
          prerelease: false
          body: |
            GitKB Desktop ${{ steps.info.outputs.tag }} public beta.

            The app is free to download and use locally.

            | System | Download |
            |---|---|
            | macOS 10.15 or newer | `GitKB_universal.dmg` |
            | Debian, Ubuntu | `GitKB_linux_x86_64.deb` or `GitKB_linux_aarch64.deb` (`sudo apt install ./GitKB_linux_<arch>.deb`) |
            | Fedora, openSUSE | `GitKB_linux_x86_64.rpm` or `GitKB_linux_aarch64.rpm` (`sudo dnf install ./GitKB_linux_<arch>.rpm`) |
            | Any Linux, including Arch | `GitKB_linux_x86_64.AppImage` or `GitKB_linux_aarch64.AppImage` (`chmod +x` it, then run it) |

            Linux packages need WebKitGTK 4.1, which the deb and rpm install for you. The AppImage runs through X11, so Wayland desktops need XWayland (GNOME, KDE and Hyprland include it).

            Requirements:
            - external `git-kb` CLI installed from Homebrew or the install script

            Install the CLI:
            ```bash
            brew install gitkb/tap/gitkb
            ```

            Or:
            ```bash
            curl -fsSL https://get.gitkb.com/install.sh | bash
            ```

            If this beta is unsigned, macOS may require opening it from Finder with Control-click > Open.
          files: release/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
